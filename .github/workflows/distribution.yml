# The platform node's distribution (spec 002): the build community-extensions runs - the very reusable workflow, the
# same inputs as duckdb-acl's - for the two platforms a platform node runs on, linux_amd64 and linux_arm64. Nothing
# else is built: no macOS, Windows or WASM artifact of hugr_node exists (duckdb-acl, the open node, keeps its matrix).
#
# Like duckdb-acl's, it builds against the release, `duckdb_version: v2.0.0` (spec 016; the 2.0 line's head until the
# tag), as community-extensions builds for 2.0.0.
name: Distribution build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

concurrency:
  group: distribution-${{ github.ref }}
  # runs fill the vcpkg cache; a cancelled one leaves nothing behind for the next
  cancel-in-progress: false

jobs:
  build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@main
    with:
      extension_name: hugr_node
      duckdb_version: v2.0.0
      ci_tools_version: main
      # linux_amd64 and linux_arm64 only (the musl legs and windows_arm64 are opt-in, so not built either)
      exclude_archs: 'osx_amd64;osx_arm64;windows_amd64;windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      # duckdb-acl's: thrift (with Arrow) wants a bison the el8 images lack only through its overlay port, and the
      # toolchain request is what duckdb-acl's legs build with - the same packages, so the same cache entries
      extra_toolchains: parser_tools
      # One vcpkg binary cache with duckdb-acl, acl-otel and tresor (Cloudflare R2, duckdb-acl's
      # docs/vcpkg-cache-r2.md): this repository reads duckdb-acl's overlay ports and triplets, so Arrow and gRPC
      # come out of the packages duckdb-acl's distribution put there. Unset, the reusable workflow falls back to
      # duckdb's public read-only cache - correct, merely slow.
      vcpkg_binary_sources: ${{ vars.VCPKG_BINARY_SOURCES }}
    secrets:
      VCPKG_CACHING_AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      VCPKG_CACHING_AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      VCPKG_CACHING_AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      VCPKG_CACHING_AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
