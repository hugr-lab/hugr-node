name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install duckdb's pinned clang-format
        run: pip install clang_format==11.0.1
      - name: clang-format check
        run: |
          find src test/cpp \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
      - name: yamllint
        run: |
          pip install yamllint
          yamllint .github/workflows

  build-test-linux:
    name: Build + test (linux_amd64)
    runs-on: ubuntu-24.04
    env:
      GEN: ninja
      # spec 006: postgres_scanner built as a loadable (never linked) for the bootstrap e2e, which publishes it into
      # its repository
      HUGR_NODE_E2E: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # The platform node is one configuration (spec 002): the built-in acl's Flight door (Arrow) and the built-in
      # tresor (OpenSSL) come from vcpkg. Its packages come from the family's R2 cache (duckdb-acl's
      # docs/vcpkg-cache-r2.md) when this repository has it, else from duckdb's public read-only cache - slow, correct.
      VCPKG_BINARY_SOURCES: >-
        ${{ vars.VCPKG_BINARY_SOURCES != '' && vars.VCPKG_BINARY_SOURCES
        || 'clear;http,https://vcpkg-cache.duckdb.org,read' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.VCPKG_CACHING_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.VCPKG_CACHING_AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ secrets.VCPKG_CACHING_AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ secrets.VCPKG_CACHING_AWS_DEFAULT_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # the nested submodules the build compiles - not their duckdb checkouts: ours is the one used
      - name: duckdb-acl's, tresor's and acl-otel's own submodules (the quack embed, the shared contracts)
        run: |
          git -C duckdb-acl submodule update --init --depth 1 third_party/quack duckdb-ext-common
          git -C tresor submodule update --init --depth 1 duckdb-ext-common
          git -C acl-otel submodule update --init --depth 1 duckdb-ext-common

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache

      - name: Setup vcpkg
        run: make vcpkg-setup

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-linux_amd64-${{ hashFiles('.gitmodules', 'duckdb/CMakeLists.txt') }}-${{ github.sha }}
          restore-keys: |
            ccache-linux_amd64-${{ hashFiles('.gitmodules', 'duckdb/CMakeLists.txt') }}-
            ccache-linux_amd64-

      - name: Build
        run: |
          EXT_FLAGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache" make
          ccache -s

      - name: The node's tests
        run: build/release/test/unittest 'test/sql/*'

      - name: C++ tests
        run: make test-cpp

      # spec 002: tresor inside the cluster - a real tresor-server from its repository (its main), Keycloak in docker,
      # two nodes of this build. It SKIPs on a developer's machine that lacks a tool; here it must have run
      - name: tresor-server (its main)
        uses: actions/checkout@v7
        with:
          repository: hugr-lab/tresor-server
          path: _tresor-server

      - uses: actions/setup-go@v6
        with:
          go-version-file: _tresor-server/go.mod
          cache: false

      # spec 005: acl_otel's export; spec 006: a node bootstraps itself - from the same make target (kista is cloned
      # from its main by the script); spec 011: the hugr type across processes
      - name: End to end - tresor inside the cluster, acl_otel's export, the bootstrap, the hugr type
        run: |
          TRESOR_SERVER_DIR=_tresor-server make test-e2e 2>&1 | tee e2e.log
          grep -q '^PASS: tresor in the cluster' e2e.log
          grep -q '^PASS: acl_otel in hugr_node' e2e.log
          grep -q '^PASS: a node bootstraps itself' e2e.log
          grep -q '^PASS: the hugr type across processes' e2e.log
          grep -q "^PASS: the hugr type's identity through tresor" e2e.log
